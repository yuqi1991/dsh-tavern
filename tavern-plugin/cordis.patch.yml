# dsh-tavern-plugin bundle：项目管理配置随版本升级；Profile patch 只保留用户覆盖。
# Tavern 默认完全权限；保留原生权限预设，用户仍可主动切回受限模式。
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: danger-full-access
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'sessions')
- id: storage-json
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'storages')
- id: bash-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
- id: pwsh-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
# dsh-web-app disables command and filesystem tools for its generic web
# profile. Tavern's card workspace is an explicitly writable Agent surface,
# so restore the cross-platform primitives here instead of replacing them
# with task-specific RPCs.
- id: tool-bash
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  disabled: false
- id: agent-presets
  config:
    default: tavern
    includeUserRoot: false
- id: tool-web
  disabled: false
  config:
    search: true
    fetch: false
# 默认 2 秒心跳、连漏 2 次即断线。手机经局域网接收数 MB 的对话分页时，解析和渲染
# 会让页面几秒读不动连接，被误判断线后重连又会把已加载的历史重置。放宽到 15 秒。
- id: typert-gateway
  config:
    websocketHeartbeatIntervalMs: 15000
- insert:
    - id: tavern-cordis-inspect
      name: dsh-tavern-plugin/cordis-inspect
    - id: dsh-tavern
      name: dsh-tavern-plugin
      inject:
        - fs
        - llm
        - webServer
        - tools
        - skills
        - agentDefaultModel
        - sandboxPolicy
        - shell
        - agentPresets
        - settings
        - tokenMeter
